[package]
name = "mallet"
description = "A Hammer-style level editor for Source engine VMF maps."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mallet-vmf.workspace = true
glam.workspace = true
eframe.workspace = true
rfd.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tiny-skia = "0.11"
base64 = "0.22"
mallet-content.workspace = true
mallet-format.workspace = true
bytemuck = { version = "1", features = ["derive"] }
egui-phosphor = "0.9"

# Low compile priority (nice) on non-Windows targets.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windowing backends for non-Windows targets: winit has no platform without
# one of these. The workspace spec carries no backend features, so Windows
# builds stay exactly as they were.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "persistence", "x11", "wayland"] }

[build-dependencies]
embed-resource = "3"
