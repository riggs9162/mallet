[workspace]
resolver = "2"
members = ["crates/mallet-kv", "crates/mallet-vmf", "crates/mallet-content", "crates/mallet-format", "crates/mallet"]

[workspace.package]
version = "0.28.0"
edition = "2021"
publish = false

[workspace.dependencies]
mallet-kv = { path = "crates/mallet-kv" }
mallet-vmf = { path = "crates/mallet-vmf" }
mallet-content = { path = "crates/mallet-content" }
mallet-format = { path = "crates/mallet-format" }
glam = "0.29"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
rfd = "0.15"

[profile.dev.package."*"]
opt-level = 2
