# Releases Mallet on every push to main. It can also be run by hand from the Actions tab.
#
# Pushes made with the workflow's own token never start workflows, so the release commit and tag do not
# trigger another run.
#
# The judge (tools/versioning/judge_version.py) reads every commit since the newest vMAJOR.MINOR.PATCH tag and asks
# the Copilot CLI for one bump per commit. The largest bump becomes the new SemVer version. The job then commits the
# version to Cargo.toml and Cargo.lock, tags it, pushes, builds the Windows executable and publishes a GitHub release.
# A second job then builds the Linux program from the new tag and adds it to that release.
#
# Run it with "linux_for" set to an existing tag to build only the Linux download and add it to that release.
#
# Run it with "preview" to see the next release notes in the run summary without releasing anything.
#
# Copilot is reached with the COPILOT_GITHUB_TOKEN secret when it is set: a fine-grained personal access token with the
# "Copilot Requests" permission. Without it the CLI tries the workflow token. If Copilot cannot be reached, each commit
# is judged from its subject instead, and the run summary says so in the "Judged by" column.
#
# Mallet is tested mostly on Windows, so the release job runs on windows-latest. The Linux download is built on
# ubuntu-22.04, so it also starts on systems a few years old.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump to apply instead of judging each commit (a major bump below 1.0.0 raises the minor version)"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      preview:
        description: "Only show the next release notes in the run summary; release nothing"
        type: boolean
        default: false
      since:
        description: "With preview, start from this older tag instead of the last release (such as v0.1.0)"
        type: string
        default: ""
      linux_for:
        description: "Only build the Linux download for this existing release (such as v0.3.0) and add it to that release"
        type: string
        default: ""

permissions:
  contents: write
  copilot-requests: write

# Runs queue instead of cancelling, so every batch of commits is released once and in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Judge the commits, tag and publish
    if: ${{ !inputs.linux_for }}
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      released: ${{ steps.judge.outputs.released }}
      tag: ${{ steps.judge.outputs.tag }}
    env:
      FORCED_BUMP: ${{ inputs.bump || 'auto' }}
      PREVIEW: ${{ inputs.preview && 'true' || 'false' }}
      SINCE: ${{ inputs.since || '' }}
      JUDGE_MODEL: ${{ vars.VERSION_JUDGE_MODEL || 'auto' }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install the Copilot CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-fund --no-audit @github/copilot
          # The npm command on Windows is a .cmd shim, which Python cannot start with an argument list.
          # Run the package's loader with node instead.
          loader="$(npm root -g | tr '\\' '/')/@github/copilot/npm-loader.js"
          test -f "$loader"
          echo "COPILOT_COMMAND=node $loader" >> "$GITHUB_ENV"

      - name: Judge the commits and set the version
        id: judge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            unset COPILOT_GITHUB_TOKEN
          fi

          workdir="$RUNNER_TEMP/copilot-workdir"
          mkdir -p "$workdir"
          notes="$RUNNER_TEMP/release-notes.md"
          result="$RUNNER_TEMP/version-result.env"

          judge=(
            python tools/versioning/judge_version.py
            --cargo-toml Cargo.toml
            --notes "$notes"
            --result "$result"
            --model "$JUDGE_MODEL"
            --workdir "$workdir"
            --forced-bump "$FORCED_BUMP"
          )
          if [ -n "$SINCE" ]; then
            judge+=(--since "$SINCE")
          fi

          if [ "$PREVIEW" = "true" ]; then
            "${judge[@]}" --dry-run
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          "${judge[@]}"
          source "$result"

          if [ "$RELEASE" != "true" ]; then
            echo "Nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$SEED" != "true" ]; then
            # Keep the lock file's version of Mallet in step with Cargo.toml, then commit both.
            cargo update --workspace
            git add Cargo.toml Cargo.lock
            git commit -m "Release version $VERSION"
          fi

          git tag -a "$TAG" -m "Version $VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

          {
            echo "released=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Build the Windows executable
        if: steps.judge.outputs.released == 'true'
        shell: bash
        env:
          TAG: ${{ steps.judge.outputs.tag }}
        run: |
          set -euo pipefail
          cargo build --release -p mallet
          exe="mallet-$TAG-windows-x64.exe"
          cp target/release/mallet.exe "$exe"
          sha256sum "$exe" > "$exe.sha256"

      - name: Publish the GitHub release
        if: steps.judge.outputs.released == 'true'
        shell: bash
        env:
          TAG: ${{ steps.judge.outputs.tag }}
          VERSION: ${{ steps.judge.outputs.version }}
          NOTES: ${{ steps.judge.outputs.notes }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "mallet-$TAG-windows-x64.exe" \
            "mallet-$TAG-windows-x64.exe.sha256" \
            --verify-tag \
            --title "Mallet $VERSION" \
            --notes-file "$NOTES"

  linux:
    name: Build the Linux download
    needs: release
    if: ${{ always() && (needs.release.outputs.released == 'true' || inputs.linux_for) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.linux_for || needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.linux_for || needs.release.outputs.tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install the system libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev

      - name: Build the Linux program
        run: |
          set -euo pipefail
          cargo build --release --locked -p mallet
          archive="mallet-$TAG-linux-x64.tar.gz"
          tar -czf "$archive" -C target/release mallet
          sha256sum "$archive" > "$archive.sha256"

      - name: Add it to the GitHub release
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "mallet-$TAG-linux-x64.tar.gz" \
            "mallet-$TAG-linux-x64.tar.gz.sha256" \
            --clobber
