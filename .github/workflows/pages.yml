# Publishes the website in site/ to GitHub Pages whenever it changes on main. It can also be run by hand from the
# Actions tab.
#
# The site is plain HTML, CSS and JavaScript, so it is uploaded as it is, without a build step. Pages has to be set
# to deploy from GitHub Actions once, under Settings > Pages > Build and deployment > Source.

name: Website

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
